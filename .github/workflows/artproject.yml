name: CI-CD-PaintingsProject

on:
  push:
    branches:
      - master
  pull_request:
  # Deploy runs only when started by hand (Actions → CI-CD-PaintingsProject → Run workflow)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: diplomeproject/paintingsproject-frontend
  BACKEND_IMAGE: diplomeproject/paintingsproject-backend

jobs:
# =====================
# CI — LINT, TESTS, BUILD CHECK
# =====================
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: paintingsdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci

      - name: Lint backend and frontend
        run: |
          npm run lint:server
          npm run lint

      - name: Frontend tests (Vitest)
        run: npm test

      - name: Configure backend for the CI database
        run: |
          cat > server/.env <<'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=ci-root-password
          DB_NAME=paintingsdb
          SESSION_SECRET=ci-session-secret
          COOKIE_SECURE=false
          EOF

      - name: Apply migrations to an empty database
        run: npm run migrate

      - name: API tests
        run: npm run test:api

      - name: Frontend build (Vite)
        run: npm run build

# =====================
# CI — BUILD & PUSH IMAGES (master only)
# =====================
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- FRONTEND ----------
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      # ---------- BACKEND ----------
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

# =====================
# CD — DEPLOY (manual only, while the server is unavailable)
# =====================
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    environment: test-srv

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PRIVATE_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "🔐 Login to GHCR"
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            echo "🌐 Create docker network"
            docker network create paintings-net || true

            echo "⬇ Pull images of this commit"
            docker pull ghcr.io/diplomeproject/paintingsproject-frontend:${{ github.sha }}
            docker pull ghcr.io/diplomeproject/paintingsproject-backend:${{ github.sha }}

            echo "🛑 Stop old containers"
            docker stop frontend backend || true
            docker rm frontend backend || true

            echo "🔑 Check backend env file"
            BACKEND_ENV_FILE="$HOME/paintings/backend.env"
            if [ ! -f "$BACKEND_ENV_FILE" ]; then
              echo "❌ $BACKEND_ENV_FILE not found. Create it from server/.env.example"
              exit 1
            fi

            echo "🚀 Start backend container"
            docker run -d \
              --name backend \
              --network paintings-net \
              --env-file "$BACKEND_ENV_FILE" \
              ghcr.io/diplomeproject/paintingsproject-backend:${{ github.sha }}

            echo "🚀 Start frontend container (PUBLIC)"
            docker run -d \
              --name frontend \
              --network paintings-net \
              -p 8080:80 \
              ghcr.io/diplomeproject/paintingsproject-frontend:${{ github.sha }}

            echo "✅ Application available at http://172.17.3.24:8080"
